<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokklubben</title>
<style>
  :root{--bg:#f5f1ea;--card:#fffdf9;--ink:#292621;--muted:#7b746b;--line:#e5ddd2;--accent:#8d5d3b;--star:#d29a32}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .wrap{max-width:1050px;margin:auto;padding:42px 20px 70px}
  header{margin-bottom:28px}
  h1{font-family:Georgia,serif;font-size:42px;margin:0 0 7px}
  .sub{color:var(--muted)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
  button,.select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;color:var(--ink);font-size:15px}
  button{cursor:pointer}
  button.active{background:var(--ink);color:white;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}
  .book{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 3px 12px #00000008}
  .num{font-size:12px;color:var(--muted);margin-bottom:7px}
  .title{font-family:Georgia,serif;font-size:22px;line-height:1.15;margin-bottom:17px}
  .rating{display:flex;align-items:center;gap:4px;margin-bottom:12px}
  .star{font-size:29px;line-height:1;border:0;background:none;padding:0;cursor:pointer;color:#d8d0c5}
  .star.on,.star.hover{color:var(--star)}
  .avg{margin-left:auto;font-weight:700;font-size:14px}
  .votes{color:var(--muted);font-weight:400}
  .mine{font-size:13px;color:var(--muted);margin-top:5px}.mine b{color:var(--ink)}
  .bar{height:6px;background:#eee8df;border-radius:99px;overflow:hidden;margin-top:12px}
  .fill{height:100%;background:var(--star);border-radius:99px}
  .legend{margin:25px 0 14px;color:var(--muted);font-size:13px}
  .status{font-size:13px;color:var(--muted);margin-top:12px;min-height:20px}
  .error{background:#fff0ed;border:1px solid #e6b8ad;color:#8b3b2d;padding:12px 14px;border-radius:12px;margin:15px 0}
  .loading{padding:25px 0;color:var(--muted)}
  @media(max-width:600px){h1{font-size:34px}.wrap{padding-top:28px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📚 Bokklubben</h1>
  <div class="sub" id="subtitle">Laddar…</div>
</header>
<div class="toolbar" id="tabs"></div>
<div id="content"><div class="loading">Hämtar böcker och betyg…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://iunoonvcydjjhpnqryrp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_gLvrE3BmoYF4X-GadC7Otw_rMN7bnMn";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let members = [];
let books = [];
let ratings = [];
let selected = localStorage.getItem("bokklubbSelectedMember") || "Gustav";
let tab = "rate";

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function getRating(bookId, memberId){
  const r = ratings.find(x => x.book_id === bookId && x.member_id === memberId);
  return r ? r.rating : null;
}

function getBookRatings(bookId){
  return members.map(m => getRating(bookId, m.id));
}

function avg(vals){
  const v = vals.filter(x => x != null);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0;
}

function renderTabs(){
  document.getElementById("tabs").innerHTML =
    `<button class="${tab==='rate'?'active':''}" onclick="tab='rate';render()">⭐ Sätt betyg</button>
     <button class="${tab==='overview'?'active':''}" onclick="tab='overview';render()">📊 Översikt</button>`;
}

function renderMembers(){
  const el = document.getElementById("members");
  el.innerHTML =
    `<strong style="width:100%;font-size:14px;color:var(--muted)">Vem är du?</strong>` +
    members.map(m =>
      `<button class="${m.name===selected?'active':''}" onclick="chooseMember('${esc(m.name)}')">👤 ${esc(m.name)}</button>`
    ).join("");
}

function chooseMember(name){
  selected = name;
  localStorage.setItem("bokklubbSelectedMember", selected);
  render();
}

function renderBooks(){
  const member = members.find(m => m.name === selected) || members[0];
  if(!member) return;

  document.getElementById("books").innerHTML = books.map((b,i)=>{
    const vals = getBookRatings(b.id);
    const mine = getRating(b.id, member.id);
    const a = avg(vals);
    const valid = vals.filter(x=>x!=null);

    return `<article class="book">
      <div class="num">#${String(i+1).padStart(2,"0")}</div>
      <div class="title">${esc(b.title)}</div>
      <div class="rating">
        ${[1,2,3,4,5].map(n =>
          `<button class="star ${mine>=n?'on':''}" aria-label="${n} av 5 stjärnor"
             onclick="rate(${b.id},${n})">★</button>`
        ).join("")}
        <div class="avg">${a?a.toFixed(1):"—"} <span class="votes">(${valid.length})</span></div>
      </div>
      <div class="mine">Ditt betyg: <b>${mine?mine+" / 5":"inte satt"}</b></div>
      <div class="bar"><div class="fill" style="width:${a*20}%"></div></div>
    </article>`;
  }).join("");
}

async function rate(bookId, value){
  const member = members.find(m => m.name === selected);
  if(!member) return;

  document.querySelectorAll(".star").forEach(b => b.disabled = true);

  const { error } = await db.from("ratings").upsert(
    {book_id: bookId, member_id: member.id, rating: value},
    {onConflict: "book_id,member_id"}
  );

  document.querySelectorAll(".star").forEach(b => b.disabled = false);

  if(error){
    showError("Kunde inte spara betyget: " + error.message);
    return;
  }

  await loadData();
  render();
}

function renderOverview(){
  const rows = books.map(b=>{
    const vals = getBookRatings(b.id);
    return {book:b, vals, avg:avg(vals)};
  }).sort((a,b)=>b.avg-a.avg);

  document.getElementById("content").innerHTML =
    `<div class="legend">Alla medlemmars betyg på samma ställe. Böckerna sorteras efter snittbetyg.</div>
     <div class="grid">${rows.map((r,i)=>`
       <article class="book">
         <div class="num">#${i+1}</div>
         <div class="title">${esc(r.book.title)}</div>
         <div style="font-size:32px;font-weight:800;margin:2px 0 4px">${r.avg?r.avg.toFixed(1):"—"}</div>
         <div class="rating" style="margin-bottom:14px">
           <span style="font-size:22px;color:var(--star)">${r.avg?"★".repeat(Math.round(r.avg)):"☆☆☆☆☆"}</span>
           <span class="votes">${r.vals.filter(x=>x!=null).length} röster</span>
         </div>
         ${members.map((m,j)=>`
           <div style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px">
             <span>${esc(m.name)}</span>
             <span style="color:var(--star)">${r.vals[j]?("★".repeat(r.vals[j])+"☆".repeat(5-r.vals[j])):"—"}</span>
           </div>`).join("")}
       </article>`).join("")}</div>`;
}

function showError(msg){
  document.getElementById("content").insertAdjacentHTML("afterbegin",
    `<div class="error">${esc(msg)}</div>`);
}

function render(){
  renderTabs();
  if(tab==="rate"){
    document.getElementById("content").innerHTML =
      `<div class="toolbar" id="members"></div>
       <div class="legend">Välj medlem och klicka sedan på stjärnorna för att sätta betyg.</div>
       <div class="grid" id="books"></div>`;
    renderMembers();
    renderBooks();
  } else {
    renderOverview();
  }
}

async function loadData(){
  const [mRes,bRes,rRes] = await Promise.all([
    db.from("members").select("id,name").order("id"),
    db.from("books").select("id,title,author,created_at").order("id"),
    db.from("ratings").select("id,book_id,member_id,rating")
  ]);

  if(mRes.error) throw mRes.error;
  if(bRes.error) throw bRes.error;
  if(rRes.error) throw rRes.error;

  members = mRes.data || [];
  books = bRes.data || [];
  ratings = rRes.data || [];

  if(!members.some(m=>m.name===selected)) selected = members[0]?.name || "Gustav";
  document.getElementById("subtitle").textContent =
    `${books.length} böcker · ${members.length} medlemmar · betyg 1–5`;
}

(async function init(){
  try{
    await loadData();
    render();
  }catch(e){
    document.getElementById("content").innerHTML =
      `<div class="error"><b>Kunde inte ansluta till Bokklubbens databas.</b><br>${esc(e.message || e)}</div>`;
  }
})();
</script>
</body>
</html>
</body>
</html>
