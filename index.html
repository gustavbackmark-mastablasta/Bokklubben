<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokklubben</title>

<style>
  :root{
    --bg:#f5f1ea;
    --card:rgba(255,253,249,0.95);
    --card-solid:#fffdf9;
    --ink:#292621;
    --muted:#746d64;
    --line:#e5ddd2;
    --accent:#8d5d3b;
    --star:#d29a32;
    --shadow:0 8px 28px rgba(42,35,27,.13);
  }

  *{
    box-sizing:border-box;
  }

  html{
    scroll-behavior:smooth;
  }

  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(
        rgba(245,241,234,.28),
        rgba(245,241,234,.28)
      ),
      url("bokklubben-bg.jpg") center center / cover fixed;
    color:var(--ink);
    font-family:
      Inter,
      ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  /* Ett mjukt lager som gör text och kort lättare att läsa */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(250,246,238,.12);
    pointer-events:none;
    z-index:-1;
  }

  .wrap{
    max-width:1080px;
    margin:auto;
    padding:44px 22px 80px;
  }

  header{
    margin-bottom:24px;
  }

  h1{
    font-family:Georgia,serif;
    font-size:44px;
    line-height:1.05;
    margin:0 0 8px;
    letter-spacing:-.8px;
    text-shadow:0 2px 10px rgba(255,255,255,.75);
  }

  .sub{
    color:var(--ink);
    font-size:14px;
    font-weight:500;
    opacity:.78;
  }

  /* --------------------------------------------------
     KNAPPAR
     -------------------------------------------------- */

  .toolbar{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin:20px 0;
  }

  button,
  .select,
  input{
    border:1px solid rgba(229,221,210,.95);
    background:rgba(255,253,249,.96);
    border-radius:12px;
    padding:10px 14px;
    color:var(--ink);
    font-size:15px;
    font-family:inherit;
  }

  button{
    cursor:pointer;
    transition:
      transform .12s ease,
      box-shadow .12s ease,
      background .12s ease,
      border-color .12s ease;
  }

  button:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(42,35,27,.10);
  }

  button:active:not(:disabled){
    transform:translateY(0);
  }

  button.active{
    background:var(--ink);
    color:white;
    border-color:var(--ink);
    box-shadow:0 4px 12px rgba(42,35,27,.16);
  }

  button.primary{
    background:var(--ink);
    color:white;
    border-color:var(--ink);
    font-weight:600;
  }

  button.primary:hover:not(:disabled){
    background:#403a34;
  }

  button:disabled{
    cursor:default;
  }

  input{
    width:100%;
    font-family:inherit;
    outline:none;
    transition:
      border-color .15s ease,
      box-shadow .15s ease;
  }

  input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(141,93,59,.12);
  }

  /* --------------------------------------------------
     BÖCKER
     -------------------------------------------------- */

  .grid{
    display:grid;
    grid-template-columns:
      repeat(auto-fill,minmax(290px,1fr));
    gap:16px;
  }

  .book{
    background:var(--card);
    border:1px solid rgba(229,221,210,.9);
    border-radius:19px;
    padding:20px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(2px);
    transition:
      transform .16s ease,
      box-shadow .16s ease;
  }

  .book:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(42,35,27,.17);
  }

  .num{
    font-size:12px;
    color:var(--muted);
    margin-bottom:7px;
    letter-spacing:.4px;
  }

  .title{
    font-family:Georgia,serif;
    font-size:22px;
    line-height:1.15;
    margin-bottom:17px;
  }

  .author{
    font-size:13px;
    color:var(--muted);
    margin-top:-10px;
    margin-bottom:15px;
  }

  /* --------------------------------------------------
     BETYG
     -------------------------------------------------- */

  .rating{
    display:flex;
    align-items:center;
    gap:3px;
    margin-bottom:12px;
  }

  .star{
    font-size:29px;
    line-height:1;
    border:0;
    background:none;
    padding:0 1px;
    cursor:pointer;
    color:#d8d0c5;
    box-shadow:none;
  }

  .star:hover:not(:disabled){
    color:var(--star);
    box-shadow:none;
    transform:scale(1.08);
  }

  .star.on{
    color:var(--star);
  }

  .avg{
    margin-left:auto;
    font-weight:750;
    font-size:14px;
  }

  .votes{
    color:var(--muted);
    font-weight:400;
  }

  .mine{
    font-size:13px;
    color:var(--muted);
    margin-top:5px;
  }

  .mine b{
    color:var(--ink);
  }

  .bar{
    height:6px;
    background:#eee8df;
    border-radius:99px;
    overflow:hidden;
    margin-top:12px;
  }

  .fill{
    height:100%;
    background:var(--star);
    border-radius:99px;
    transition:width .25s ease;
  }

  /* --------------------------------------------------
     TEXT / STATUS
     -------------------------------------------------- */

  .legend{
    margin:24px 0 14px;
    color:var(--muted);
    font-size:13px;
  }

  .status{
    font-size:13px;
    color:var(--muted);
    margin-top:12px;
    min-height:20px;
  }

  .error{
    background:#fff0ed;
    border:1px solid #e6b8ad;
    color:#8b3b2d;
    padding:13px 15px;
    border-radius:13px;
    margin:15px 0;
    box-shadow:0 4px 14px rgba(80,35,25,.08);
  }

  .success{
    background:#edf8ef;
    border:1px solid #b8d9bd;
    color:#32633a;
    padding:13px 15px;
    border-radius:13px;
    margin:15px 0;
  }

  .loading{
    padding:30px 0;
    color:var(--muted);
  }

  /* --------------------------------------------------
     LÄGG TILL BOK
     -------------------------------------------------- */

  .form-card{
    max-width:600px;
    background:var(--card);
    border:1px solid rgba(229,221,210,.9);
    border-radius:19px;
    padding:25px;
    box-shadow:var(--shadow);
  }

  .form-label{
    display:block;
    font-weight:650;
    font-size:14px;
    margin:0 0 7px;
  }

  .form-group{
    margin-bottom:18px;
  }

  /* --------------------------------------------------
     ÖVERSIKT
     -------------------------------------------------- */

  .overview-member{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-top:1px solid var(--line);
    font-size:14px;
  }

  .overview-score{
    font-size:32px;
    font-weight:800;
    margin:2px 0 4px;
  }

  .overview-stars{
    font-size:22px;
    color:var(--star);
  }

  /* --------------------------------------------------
     MOBIL
     -------------------------------------------------- */

  @media(max-width:700px){

    .wrap{
      padding:28px 15px 60px;
    }

    h1{
      font-size:36px;
    }

    .grid{
      grid-template-columns:1fr;
      gap:13px;
    }

    .book{
      padding:18px;
    }

    .toolbar{
      gap:8px;
    }

    button{
      padding:10px 13px;
    }
  }

  @media(max-width:420px){

    h1{
      font-size:32px;
    }

    .sub{
      font-size:13px;
    }

    .star{
      font-size:27px;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <header>
    <h1>📚 Bokklubben</h1>
    <div class="sub" id="subtitle">Laddar…</div>
  </header>

  <div class="toolbar" id="tabs"></div>

  <div id="content">
    <div class="loading">
      Hämtar böcker och betyg…
    </div>
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://iunoonvcydjjhpnqryrp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_gLvrE3BmoYF4X-GadC7Otw_rMN7bnMn";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


let members = [];
let books = [];
let ratings = [];

let selected =
  localStorage.getItem("bokklubbSelectedMember") ||
  "Gustav";

let tab = "rate";


function esc(s){

  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


function getRating(bookId, memberId){

  const r = ratings.find(
    x =>
      x.book_id === bookId &&
      x.member_id === memberId
  );

  return r ? r.rating : null;

}


function getBookRatings(bookId){

  return members.map(
    m => getRating(bookId, m.id)
  );

}


function avg(vals){

  const v =
    vals.filter(x => x != null);

  return v.length
    ? v.reduce((a,b)=>a+b,0) / v.length
    : 0;

}


/* --------------------------------------------------
   NAVIGATION
   -------------------------------------------------- */

function renderTabs(){

  document.getElementById("tabs").innerHTML =

    `<button
      class="${tab==='rate'?'active':''}"
      onclick="tab='rate';render()">
      ⭐ Sätt betyg
    </button>`

    +

    `<button
      class="${tab==='overview'?'active':''}"
      onclick="tab='overview';render()">
      📊 Översikt
    </button>`

    +

    `<button
      class="${tab==='add'?'active':''}"
      onclick="tab='add';render()">
      ➕ Lägg till bok
    </button>`;

}


/* --------------------------------------------------
   MEDLEMMAR
   -------------------------------------------------- */

function renderMembers(){

  const el =
    document.getElementById("members");

  el.innerHTML =

    `<strong
      style="
        width:100%;
        font-size:14px;
        color:var(--muted);
      ">
      Vem är du?
    </strong>`

    +

    members.map(m =>

      `<button
        class="${m.name===selected?'active':''}"
        onclick="chooseMember('${esc(m.name)}')">
        👤 ${esc(m.name)}
      </button>`

    ).join("");

}


function chooseMember(name){

  selected = name;

  localStorage.setItem(
    "bokklubbSelectedMember",
    selected
  );

  render();

}


/* --------------------------------------------------
   BOKKORT
   -------------------------------------------------- */

function renderBooks(){

  const member =
    members.find(
      m => m.name === selected
    ) || members[0];

  if(!member) return;

  document.getElementById("books").innerHTML =

    books.map((b,i)=>{

      const vals =
        getBookRatings(b.id);

      const mine =
        getRating(
          b.id,
          member.id
        );

      const a = avg(vals);

      const valid =
        vals.filter(
          x => x != null
        );

      return `

      <article class="book">

        <div class="num">
          #${String(i+1).padStart(2,"0")}
        </div>

        <div class="title">
          ${esc(b.title)}
        </div>

        ${b.author ? `
          <div class="author">
            ${esc(b.author)}
          </div>
        ` : ""}

        <div class="rating">

          ${[1,2,3,4,5].map(n =>

            `<button
              class="star ${mine>=n?'on':''}"
              aria-label="${n} av 5 stjärnor"
              onclick="rate(${b.id},${n})">
              ★
            </button>`

          ).join("")}

          <div class="avg">
            ${a ? a.toFixed(1) : "—"}

            <span class="votes">
              (${valid.length})
            </span>
          </div>

        </div>

        <div class="mine">
          Ditt betyg:
          <b>
            ${mine ? mine+" / 5" : "inte satt"}
          </b>
        </div>

        <div class="bar">
          <div
            class="fill"
            style="width:${a*20}%">
          </div>
        </div>

      </article>`;

    }).join("");

}


/* --------------------------------------------------
   SÄTT BETYG
   -------------------------------------------------- */

async function rate(bookId,value){

  const member =
    members.find(
      m => m.name === selected
    );

  if(!member) return;

  document
    .querySelectorAll(".star")
    .forEach(
      b => b.disabled = true
    );


  const { error } =
    await db
      .from("ratings")
      .upsert(
        {
          book_id:bookId,
          member_id:member.id,
          rating:value
        },
        {
          onConflict:
            "book_id,member_id"
        }
      );


  document
    .querySelectorAll(".star")
    .forEach(
      b => b.disabled = false
    );


  if(error){

    showError(
      "Kunde inte spara betyget: " +
      error.message
    );

    return;
  }


  await loadData();

  render();

}


/* --------------------------------------------------
   ÖVERSIKT
   -------------------------------------------------- */

function renderOverview(){

  const rows =

    books
      .map(b=>{

        const vals =
          getBookRatings(b.id);

        return {
          book:b,
          vals,
          avg:avg(vals)
        };

      })
      .sort(
        (a,b)=>b.avg-a.avg
      );


  document.getElementById("content").innerHTML =

    `<div class="legend">
      Alla medlemmars betyg på samma ställe.
      Böckerna sorteras efter snittbetyg.
    </div>

    <div class="grid">

      ${rows.map((r,i)=>`

        <article class="book">

          <div class="num">
            #${i+1}
          </div>

          <div class="title">
            ${esc(r.book.title)}
          </div>

          ${r.book.author ? `
            <div class="author">
              ${esc(r.book.author)}
            </div>
          ` : ""}

          <div class="overview-score">
            ${r.avg
              ? r.avg.toFixed(1)
              : "—"}
          </div>

          <div
            class="rating"
            style="margin-bottom:14px">

            <span class="overview-stars">
              ${r.avg
                ? "★".repeat(
                    Math.round(r.avg)
                  )
                : "☆☆☆☆☆"}
            </span>

            <span class="votes">
              ${r.vals.filter(
                x=>x!=null
              ).length}
              röster
            </span>

          </div>

          ${members.map((m,j)=>`

            <div class="overview-member">

              <span>
                ${esc(m.name)}
              </span>

              <span
                style="color:var(--star)">

                ${r.vals[j]
                  ? (
                    "★".repeat(
                      r.vals[j]
                    )
                    +
                    "☆".repeat(
                      5-r.vals[j]
                    )
                  )
                  : "—"}

              </span>

            </div>

          `).join("")}

        </article>

      `).join("")}

    </div>`;

}


/* --------------------------------------------------
   LÄGG TILL BOK
   -------------------------------------------------- */

function renderAddBook(){

  document.getElementById("content").innerHTML =

    `<div class="legend">
      Lägg till en ny bok i bokklubben.
      Den blir automatiskt tillgänglig
      för alla medlemmar att betygsätta.
    </div>

    <div class="form-card">

      <div class="form-group">

        <label
          class="form-label"
          for="bookTitle">
          Titel *
        </label>

        <input
          id="bookTitle"
          type="text"
          placeholder="T.ex. Hundra år av ensamhet"
          autocomplete="off">

      </div>


      <div class="form-group">

        <label
          class="form-label"
          for="bookAuthor">
          Författare
        </label>

        <input
          id="bookAuthor"
          type="text"
          placeholder="Valfritt"
          autocomplete="off">

      </div>


      <button
        class="primary"
        id="addBookButton"
        onclick="addBook()">

        ➕ Lägg till bok

      </button>


      <div
        id="addBookStatus"
        class="status">
      </div>

    </div>`;

}


async function addBook(){

  const titleInput =
    document.getElementById(
      "bookTitle"
    );

  const authorInput =
    document.getElementById(
      "bookAuthor"
    );

  const button =
    document.getElementById(
      "addBookButton"
    );

  const status =
    document.getElementById(
      "addBookStatus"
    );


  const title =
    titleInput.value.trim();

  const author =
    authorInput.value.trim();


  if(!title){

    status.textContent =
      "Skriv en titel först.";

    titleInput.focus();

    return;
  }


  button.disabled = true;

  status.textContent =
    "Lägger till boken…";


  const {data,error} =
    await db
      .from("books")
      .insert({
        title:title,
        author:author || null
      })
      .select()
      .single();


  if(error){

    button.disabled = false;

    status.textContent = "";

    showError(
      "Kunde inte lägga till boken: " +
      error.message
    );

    return;
  }


  await loadData();


  status.innerHTML =

    `<span style="color:#32633a">

      ✓ <b>
        ${esc(data.title)}
      </b>
      har lagts till!

    </span>`;


  titleInput.value = "";
  authorInput.value = "";

  button.disabled = false;

  renderTabs();


  setTimeout(()=>{

    tab = "rate";

    render();

  },1200);

}


/* --------------------------------------------------
   FEL
   -------------------------------------------------- */

function showError(msg){

  document
    .getElementById("content")
    .insertAdjacentHTML(

      "afterbegin",

      `<div class="error">
        ${esc(msg)}
      </div>`

    );

}


/* --------------------------------------------------
   RENDER
   -------------------------------------------------- */

function render(){

  renderTabs();


  if(tab==="rate"){

    document.getElementById(
      "content"
    ).innerHTML =

      `<div
        class="toolbar"
        id="members">
      </div>

      <div class="legend">
        Välj medlem och klicka sedan
        på stjärnorna för att sätta betyg.
      </div>

      <div
        class="grid"
        id="books">
      </div>`;


    renderMembers();

    renderBooks();

  }


  else if(tab==="overview"){

    renderOverview();

  }


  else if(tab==="add"){

    renderAddBook();

  }

}


/* --------------------------------------------------
   HÄMTA DATA FRÅN SUPABASE
   -------------------------------------------------- */

async function loadData(){

  const [
    mRes,
    bRes,
    rRes
  ] = await Promise.all([

    db
      .from("members")
      .select("id,name")
      .order("id"),

    db
      .from("books")
      .select(
        "id,title,author,created_at"
      )
      .order("id"),

    db
      .from("ratings")
      .select(
        "id,book_id,member_id,rating"
      )

  ]);


  if(mRes.error)
    throw mRes.error;

  if(bRes.error)
    throw bRes.error;

  if(rRes.error)
    throw rRes.error;


  members =
    mRes.data || [];

  books =
    bRes.data || [];

  ratings =
    rRes.data || [];


  if(
    !members.some(
      m => m.name === selected
    )
  ){

    selected =
      members[0]?.name ||
      "Gustav";

  }


  document
    .getElementById("subtitle")
    .textContent =

      `${books.length} böcker · ` +
      `${members.length} medlemmar · ` +
      `betyg 1–5`;

}


/* --------------------------------------------------
   START
   -------------------------------------------------- */

(async function init(){

  try{

    await loadData();

    render();

  }

  catch(e){

    document
      .getElementById("content")
      .innerHTML =

      `<div class="error">

        <b>
          Kunde inte ansluta
          till Bokklubbens databas.
        </b>

        <br>

        ${esc(
          e.message || e
        )}

      </div>`;

  }

})();

</script>

</body>
</html>
