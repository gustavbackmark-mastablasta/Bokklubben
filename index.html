<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bokklubben</title>

<style>

:root{
  --bg:#f5f1ea;
  --card:rgba(255,253,249,.94);
  --ink:#292621;
  --muted:#746d64;
  --line:#ddd5c9;
  --accent:#8d5d3b;
  --star:#d29a32;
  --shadow:0 8px 28px rgba(42,35,27,.13);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    linear-gradient(
      rgba(245,241,234,.28),
      rgba(245,241,234,.28)
    ),
    url("bokklubben-bg.png") center center / cover fixed;

  color:var(--ink);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.wrap{
  max-width:1080px;
  margin:auto;
  padding:44px 22px 80px;
}


/* =========================
   RUBRIK
   ========================= */

header{
  margin-bottom:24px;
}

h1{
  font-family:Georgia,serif;
  font-size:44px;
  line-height:1.05;
  margin:0 0 8px;
  letter-spacing:-.8px;
  text-shadow:0 2px 10px rgba(255,255,255,.75);
}

.sub{
  color:var(--ink);
  font-size:14px;
  font-weight:500;
  opacity:.78;
}


/* =========================
   KNAPPAR
   ========================= */

.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin:20px 0;
}

button,
input{
  border:1px solid rgba(229,221,210,.95);
  background:rgba(255,253,249,.96);
  border-radius:12px;
  padding:10px 14px;
  color:var(--ink);
  font-size:15px;
  font-family:inherit;
}

button{
  cursor:pointer;
  transition:
    transform .12s ease,
    box-shadow .12s ease,
    background .12s ease,
    border-color .12s ease;
}

button:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(42,35,27,.10);
}

button.active{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
  box-shadow:0 4px 12px rgba(42,35,27,.16);
}

button.primary{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
  font-weight:600;
}

button:disabled{
  cursor:default;
}


/* =========================
   BOKKORT
   ========================= */

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(290px,1fr));
  gap:16px;
}

.book{
  background:var(--card);
  border:1px solid rgba(229,221,210,.9);
  border-radius:19px;
  padding:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(2px);
}

.num{
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
  letter-spacing:.4px;
}

.title{
  font-family:Georgia,serif;
  font-size:22px;
  line-height:1.15;
  margin-bottom:17px;
  font-weight:700;
}

.author{
  font-size:13px;
  color:var(--muted);
}


/* =========================
   STJÄRNOR
   ========================= */

.rating{
  display:flex;
  align-items:center;
  gap:3px;
  margin-bottom:12px;
}

.star{
  font-size:29px;
  line-height:1;
  border:0;
  background:none;
  padding:0 1px;
  cursor:pointer;
  color:#d8d0c5;
  box-shadow:none;
}

.star:hover:not(:disabled){
  color:var(--star);
  box-shadow:none;
  transform:scale(1.08);
}

.star.on{
  color:var(--star);
}

.avg{
  margin-left:auto;
  font-weight:750;
  font-size:14px;
}

.votes{
  color:var(--muted);
  font-weight:400;
}

.mine{
  font-size:13px;
  color:var(--muted);
  margin-top:5px;
}

.mine b{
  color:var(--ink);
}

.bar{
  height:6px;
  background:#eee8df;
  border-radius:99px;
  overflow:hidden;
  margin-top:12px;
}

.fill{
  height:100%;
  background:var(--star);
  border-radius:99px;
  transition:width .25s ease;
}


/* =========================
   TEXT
   ========================= */

.legend{
  margin:24px 0 14px;
  color:var(--muted);
  font-size:13px;
}

.status{
  font-size:13px;
  color:var(--muted);
  margin-top:12px;
  min-height:20px;
}

.loading{
  padding:25px 0;
  color:var(--muted);
  font-size:15px;
}

.error{
  background:#fff0ed;
  border:1px solid #e6b8ad;
  color:#8b3b2d;
  padding:12px 14px;
  border-radius:12px;
  margin:15px 0;
}


/* =========================
   LÄGG TILL BOK
   ========================= */

.add-box{
  max-width:650px;
  background:var(--card);
  border:1px solid rgba(229,221,210,.9);
  border-radius:19px;
  padding:25px;
  box-shadow:var(--shadow);
}

.add-box h2{
  font-family:Georgia,serif;
  margin:0 0 20px;
  font-size:27px;
}

.add-form{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.add-form input{
  flex:1 1 220px;
}

.add-form button{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
  font-weight:600;
}


/* =========================
   ÖVERSIKT – TABELL
   ========================= */

.overview-table{
  width:100%;
  background:var(--card);
  border:1px solid rgba(229,221,210,.9);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.overview-row{
  display:grid;

  grid-template-columns:
    42px
    minmax(0,1fr)
    62px
    62px
    62px
    62px
    70px;

  align-items:center;

  min-height:68px;

  border-top:1px solid var(--line);
}

.overview-header{
  min-height:56px;
  background:rgba(235,228,217,.70);
  border-top:0;
  font-size:15px;
  font-weight:700;
}


/* Placering */

.rank{
  text-align:center;
  color:var(--muted);
  font-size:13px;
}


/* Boktitel */

.book-name{
  min-width:0;
  padding:10px 12px;

  font-family:Georgia,serif;
  font-size:21px;
  font-weight:700;

  white-space:normal;
  overflow-wrap:anywhere;
}

.overview-header .book-name{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    sans-serif;

  font-size:18px;
  font-weight:800;
}


/* Personkolumner */

.person-header,
.average-header{
  border:0;
  background:none;
  border-radius:0;

  padding:16px 4px;

  font-weight:700;
  font-size:14px;

  color:var(--ink);

  box-shadow:none;
}

.person-header:hover,
.average-header:hover{
  background:rgba(141,93,59,.08);
  box-shadow:none;
  transform:none;
}

.person-header.selected-sort,
.average-header.selected-sort{
  color:var(--accent);
}


/* Betyg */

.score{
  text-align:center;
  font-size:18px;
  font-weight:500;
}

.average{
  text-align:center;
  font-size:18px;
  font-weight:800;
}


/* =========================
   MOBIL
   ========================= */

@media(max-width:700px){

  .wrap{
    padding:26px 12px 60px;
  }

  h1{
    font-size:34px;
  }

  .legend{
    font-size:14px;
    line-height:1.45;
  }

  .overview-row{
    grid-template-columns:
      30px
      minmax(0,1fr)
      42px
      42px
      42px
      42px
      50px;

    min-height:60px;
  }

  .overview-header{
    min-height:50px;
  }

  .book-name{
    padding:8px 6px;
    font-size:17px;
  }

  .overview-header .book-name{
    font-size:16px;
  }

  .rank{
    font-size:12px;
  }

  .score{
    font-size:16px;
  }

  .average{
    font-size:17px;
  }

  .person-header,
  .average-header{
    padding:14px 2px;
    font-size:13px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .add-form{
    flex-direction:column;
  }

  .add-form button{
    width:100%;
  }
}


/* =========================
   EXTRA LITEN MOBIL
   ========================= */

@media(max-width:430px){

  .wrap{
    padding-left:8px;
    padding-right:8px;
  }

  .overview-row{
    grid-template-columns:
      27px
      minmax(0,1fr)
      38px
      38px
      38px
      38px
      45px;
  }

  .book-name{
    font-size:16px;
  }

  .score{
    font-size:15px;
  }

  .average{
    font-size:16px;
  }

  .person-header,
  .average-header{
    font-size:12px;
  }
}

</style>
</head>


<body>

<div class="wrap">

<header>

  <h1>📚 Bokklubben</h1>

  <div class="sub" id="subtitle">
    Laddar…
  </div>

</header>


<div class="toolbar" id="tabs"></div>


<div id="content">

  <div class="loading">
    Hämtar böcker och betyg…
  </div>

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
  "https://iunoonvcydjjhpnqryrp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_gLvrE3BmoYF4X-GadC7Otw_rMN7bnMn";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   APP DATA
   ========================= */

let members = [];
let books = [];
let ratings = [];

let selected =
  localStorage.getItem("bokklubbSelectedMember")
  || "Gustav";

let tab = "rate";

let overviewSort = "avg";
let overviewDirection = "desc";


/* =========================
   HELPERS
   ========================= */

function esc(s){

  return String(s ?? "").replace(
    /[&<>"']/g,

    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


function getRating(bookId,memberId){

  const r =
    ratings.find(
      x =>
        x.book_id === bookId &&
        x.member_id === memberId
    );

  return r
    ? r.rating
    : null;

}


function getBookRatings(bookId){

  return members.map(
    m => getRating(bookId,m.id)
  );

}


function avg(vals){

  const v =
    vals.filter(
      x => x != null
    );

  return v.length
    ? v.reduce((a,b)=>a+b,0) / v.length
    : 0;

}


/* =========================
   TABS
   ========================= */

function renderTabs(){

  document.getElementById("tabs").innerHTML =

    `<button
      class="${tab==='rate'?'active':''}"
      onclick="tab='rate';render()">
      ⭐ Sätt betyg
    </button>

     <button
      class="${tab==='overview'?'active':''}"
      onclick="tab='overview';render()">
      📊 Översikt
    </button>

     <button
      class="${tab==='add'?'active':''}"
      onclick="tab='add';render()">
      ➕ Lägg till bok
    </button>`;

}


/* =========================
   MEMBERS
   ========================= */

function renderMembers(){

  const el =
    document.getElementById("members");

  el.innerHTML =

    `<strong
      style="
        width:100%;
        font-size:14px;
        color:var(--muted)">
      Vem är du?
    </strong>` +

    members.map(m =>

      `<button
        class="${m.name===selected?'active':''}"
        onclick="chooseMember('${esc(m.name)}')">

        👤 ${esc(m.name)}

      </button>`

    ).join("");

}


function chooseMember(name){

  selected = name;

  localStorage.setItem(
    "bokklubbSelectedMember",
    selected
  );

  render();

}


/* =========================
   RATE VIEW
   ========================= */

function renderBooks(){

  const member =
    members.find(
      m => m.name === selected
    ) || members[0];

  if(!member) return;


  document.getElementById("books").innerHTML =

    [...books].sort((a,b)=>{

  const ratingA = getRating(a.id, member.id);
  const ratingB = getRating(b.id, member.id);

  // Böcker utan betyg hamnar längst ner
  if(ratingA == null && ratingB != null) return 1;
  if(ratingB == null && ratingA != null) return -1;

  // Högsta betyg först
  if(ratingA != null && ratingB != null){
    return ratingB - ratingA;
  }

  // Behåll bokordningen om båda saknar betyg
  return a.id - b.id;

}).map((b,i)=>{

      const vals =
        getBookRatings(b.id);

      const mine =
        getRating(
          b.id,
          member.id
        );

      const a =
        avg(vals);

      const valid =
        vals.filter(
          x => x != null
        );


      return `

        <article class="book">

          <div class="num">
            #${String(i+1).padStart(2,"0")}
          </div>

          <div class="title">
            ${esc(b.title)}
          </div>

          <div class="rating">

            ${[1,2,3,4,5].map(n =>

              `<button
                class="star ${mine>=n?'on':''}"
                aria-label="${n} av 5 stjärnor"
                onclick="rate(${b.id},${n})">
                ★
              </button>`

            ).join("")}

            <div class="avg">

              ${a ? a.toFixed(1) : "—"}

              <span class="votes">
                (${valid.length})
              </span>

            </div>

          </div>


          <div class="mine">

            Ditt betyg:

            <b>
              ${mine
                ? mine+" / 5"
                : "inte satt"}
            </b>

          </div>


          <div class="bar">

            <div
              class="fill"
              style="width:${a*20}%">
            </div>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================
   SAVE RATING
   ========================= */

async function rate(bookId,value){

  const member =
    members.find(
      m => m.name === selected
    );

  if(!member) return;


  document
    .querySelectorAll(".star")
    .forEach(
      b => b.disabled = true
    );


  const { error } =
    await db
      .from("ratings")
      .upsert(

        {
          book_id:bookId,
          member_id:member.id,
          rating:value
        },

        {
          onConflict:
            "book_id,member_id"
        }

      );


  document
    .querySelectorAll(".star")
    .forEach(
      b => b.disabled = false
    );


  if(error){

    showError(
      "Kunde inte spara betyget: "
      + error.message
    );

    return;

  }


  await loadData();

  render();

}


/* =========================
   OVERVIEW SORTING
   ========================= */

function sortOverviewBy(key){

  if(overviewSort === key){

    overviewDirection =
      overviewDirection === "desc"
        ? "asc"
        : "desc";

  } else {

    overviewSort = key;

    overviewDirection = "desc";

  }

  renderOverview();

}


/* =========================
   OVERVIEW
   ========================= */

function renderOverview(){

  const rows = books.map(b => {

    const vals =
      getBookRatings(b.id);

    return {
      book:b,
      vals:vals,
      avg:avg(vals)
    };

  });


  rows.sort((a,b)=>{

    let aValue;
    let bValue;


    if(overviewSort === "avg"){

      aValue = a.avg;
      bValue = b.avg;

    } else {

      const memberIndex =
        members.findIndex(
          m =>
            String(m.id) ===
            String(overviewSort)
        );


      aValue =
        memberIndex >= 0
          ? (a.vals[memberIndex] ?? -1)
          : -1;


      bValue =
        memberIndex >= 0
          ? (b.vals[memberIndex] ?? -1)
          : -1;

    }


    /*
       Böcker utan betyg hamnar sist,
       oavsett sorteringsriktning.
    */

    if(aValue === -1 && bValue !== -1)
      return 1;

    if(bValue === -1 && aValue !== -1)
      return -1;


    if(aValue === bValue)
      return a.book.id - b.book.id;


    return overviewDirection === "desc"
      ? bValue - aValue
      : aValue - bValue;

  });


  function arrow(key){

    if(overviewSort !== key)
      return "";

    return overviewDirection === "desc"
      ? " ↓"
      : " ↑";

  }


  document.getElementById("content").innerHTML = `

    <div class="legend">
      Klicka på ett namn eller Snitt för att sortera.
    </div>


    <div class="overview-table">


      <div class="overview-row overview-header">

        <div class="rank">
          #
        </div>


        <div class="book-name">
          Bok
        </div>


        ${members.map(m => `

          <button
            class="person-header ${
              String(overviewSort) === String(m.id)
                ? "selected-sort"
                : ""
            }"

            onclick="sortOverviewBy('${m.id}')"

            title="Sortera efter ${esc(m.name)}">

            ${esc(m.name)}
            ${arrow(String(m.id))}

          </button>

        `).join("")}


        <button
          class="average-header ${
            overviewSort === "avg"
              ? "selected-sort"
              : ""
          }"

          onclick="sortOverviewBy('avg')"

          title="Sortera efter snitt">

          Snitt
          ${arrow("avg")}

        </button>


      </div>


      ${rows.map((r,i)=>`

        <div class="overview-row">

          <div class="rank">
            ${i+1}
          </div>


          <div
            class="book-name"
            title="${esc(r.book.title)}">

            ${esc(r.book.title)}

          </div>


          ${r.vals.map(v=>`

            <div class="score">

              ${v != null ? v : "–"}

            </div>

          `).join("")}


          <div class="average">

            ${r.avg
              ? r.avg.toFixed(1)
              : "–"}

          </div>


        </div>

      `).join("")}


    </div>

  `;

}


/* =========================
   ADD BOOK
   ========================= */

function renderAddBook(){

  document.getElementById("content").innerHTML = `

    <div class="add-box">

      <h2>
        ➕ Lägg till bok
      </h2>


      <div class="add-form">

        <input
          id="newTitle"
          type="text"
          placeholder="Boktitel"
          maxlength="200">


        <input
          id="newAuthor"
          type="text"
          placeholder="Författare (valfritt)"
          maxlength="200">


        <button
          onclick="addBook()">

          Lägg till

        </button>

      </div>


      <div
        id="addStatus"
        class="status">
      </div>


    </div>

  `;

}


/* =========================
   INSERT NEW BOOK
   ========================= */

async function addBook(){

  const titleEl =
    document.getElementById("newTitle");

  const authorEl =
    document.getElementById("newAuthor");

  const status =
    document.getElementById("addStatus");


  const title =
    titleEl.value.trim();

  const author =
    authorEl.value.trim();


  if(!title){

    status.textContent =
      "Skriv en boktitel först.";

    titleEl.focus();

    return;

  }


  status.textContent =
    "Lägger till boken…";


  const { error } =
    await db
      .from("books")
      .insert({

        title:title,

        author:
          author || null

      });


  if(error){

    status.textContent =
      "Kunde inte lägga till boken: "
      + error.message;

    return;

  }


  await loadData();

  tab = "rate";

  render();

}


/* =========================
   ERROR
   ========================= */

function showError(msg){

  document
    .getElementById("content")
    .insertAdjacentHTML(

      "afterbegin",

      `<div class="error">

        ${esc(msg)}

      </div>`

    );

}


/* =========================
   MAIN RENDER
   ========================= */

function render(){

  renderTabs();


  if(tab === "rate"){

    document.getElementById("content").innerHTML = `

      <div
        class="toolbar"
        id="members">
      </div>


      <div class="legend">

        Välj medlem och klicka sedan
        på stjärnorna för att sätta betyg.

      </div>


      <div
        class="grid"
        id="books">
      </div>

    `;


    renderMembers();

    renderBooks();


  }

  else if(tab === "overview"){

    renderOverview();

  }

  else if(tab === "add"){

    renderAddBook();

  }

}


/* =========================
   LOAD DATABASE
   ========================= */

async function loadData(){

  const [
    mRes,
    bRes,
    rRes
  ] = await Promise.all([

    db
      .from("members")
      .select("id,name")
      .order("id"),


    db
      .from("books")
      .select(
        "id,title,author,created_at"
      )
      .order("id"),


    db
      .from("ratings")
      .select(
        "id,book_id,member_id,rating"
      )

  ]);


  if(mRes.error)
    throw mRes.error;

  if(bRes.error)
    throw bRes.error;

  if(rRes.error)
    throw rRes.error;


  members =
    mRes.data || [];

  books =
    bRes.data || [];

  ratings =
    rRes.data || [];


  if(
    !members.some(
      m => m.name === selected
    )
  ){

    selected =
      members[0]?.name
      || "Gustav";

  }


  document
    .getElementById("subtitle")
    .textContent =

      `${books.length} böcker · `
      + `${members.length} medlemmar · `
      + `betyg 1–5`;

}


/* =========================
   START
   ========================= */

(async function init(){

  try{

    await loadData();

    render();

  }

  catch(e){

    document
      .getElementById("content")
      .innerHTML = `

        <div class="error">

          <b>
            Kunde inte ansluta
            till Bokklubbens databas.
          </b>

          <br>

          ${esc(e.message || e)}

        </div>

      `;

  }

})();

</script>

</body>
</html>
