<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bokklubben</title>

<style>

:root{
  --bg:#f5f1ea;
  --card:rgba(255,253,249,0.94);
  --ink:#292621;
  --muted:#7b746b;
  --line:#e5ddd2;
  --accent:#8d5d3b;
  --star:#d29a32;
  --shadow:0 8px 28px rgba(42,35,27,.13);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    linear-gradient(
      rgba(245,241,234,.30),
      rgba(245,241,234,.30)
    ),
    url("bokklubben-bg.png") center center / cover fixed;

  color:var(--ink);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =========================
   LAYOUT
   ========================= */

.wrap{
  max-width:1050px;
  margin:auto;
  padding:42px 20px 80px;
}

header{
  margin-bottom:26px;
}

h1{
  font-family:Georgia,serif;
  font-size:42px;
  line-height:1;
  margin:0 0 8px;
  letter-spacing:-1px;
}

.sub{
  color:var(--muted);
  font-size:14px;
}


/* =========================
   BUTTONS
   ========================= */

.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin:20px 0;
}

button,
.select,
input{
  border:1px solid var(--line);
  background:rgba(255,253,249,.94);
  border-radius:12px;
  padding:10px 14px;
  color:var(--ink);
  font-size:15px;
}

button{
  cursor:pointer;
  transition:
    transform .12s ease,
    box-shadow .12s ease,
    background .12s ease;
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

button.active{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
}


/* =========================
   BOOK GRID
   ========================= */

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(290px,1fr));
  gap:15px;
}

.book{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:19px;

  box-shadow:var(--shadow);

  backdrop-filter:blur(3px);
}

.num{
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
}

.title{
  font-family:Georgia,serif;
  font-size:22px;
  line-height:1.15;
  margin-bottom:17px;
}

.rating{
  display:flex;
  align-items:center;
  gap:4px;
  margin-bottom:12px;
}

.star{
  font-size:29px;
  line-height:1;
  border:0;
  background:none;
  padding:0;
  cursor:pointer;
  color:#d8d0c5;
  box-shadow:none;
}

.star:hover{
  transform:none;
  box-shadow:none;
}

.star.on{
  color:var(--star);
}

.avg{
  margin-left:auto;
  font-weight:700;
  font-size:14px;
}

.votes{
  color:var(--muted);
  font-weight:400;
}

.mine{
  font-size:13px;
  color:var(--muted);
  margin-top:5px;
}

.mine b{
  color:var(--ink);
}

.bar{
  height:6px;
  background:#eee8df;
  border-radius:99px;
  overflow:hidden;
  margin-top:12px;
}

.fill{
  height:100%;
  background:var(--star);
  border-radius:99px;
}


/* =========================
   GENERAL
   ========================= */

.legend{
  margin:24px 0 14px;
  color:var(--muted);
  font-size:13px;
}

.status{
  font-size:13px;
  color:var(--muted);
  margin-top:12px;
  min-height:20px;
}

.error{
  background:#fff0ed;
  border:1px solid #e6b8ad;
  color:#8b3b2d;
  padding:12px 14px;
  border-radius:12px;
  margin:15px 0;
}

.loading{
  padding:25px 0;
  color:var(--muted);
}


/* =========================
   ADD BOOK
   ========================= */

.add-box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.add-box h2{
  font-family:Georgia,serif;
  font-size:25px;
  margin:0 0 15px;
}

.add-form{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.add-form input{
  flex:1 1 250px;
  min-width:0;
}

.add-form button{
  background:var(--ink);
  color:white;
  border-color:var(--ink);
}

.cancel-button{
  background:transparent !important;
  color:var(--ink) !important;
  border-color:var(--line) !important;
}


/* =========================
   OVERVIEW
   ========================= */

.overview-wrap{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  backdrop-filter:blur(4px);
}

.overview-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

.overview-table th{
  background:rgba(239,233,224,.82);
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  text-align:center;
  padding:13px 10px;
  border-bottom:1px solid var(--line);
}

.overview-table th:first-child{
  text-align:left;
  width:46%;
}

.overview-table th:last-child{
  width:11%;
}

.overview-table td{
  padding:14px 10px;
  border-bottom:1px solid var(--line);
  text-align:center;
  font-size:16px;
}

.overview-table tr:last-child td{
  border-bottom:0;
}

.overview-table td:first-child{
  text-align:left;
  font-family:Georgia,serif;
  font-size:17px;
  line-height:1.2;
}

.overview-table .score{
  font-weight:500;
}

.overview-table .average{
  font-weight:800;
  font-size:18px;
}

.overview-table .rank{
  color:var(--muted);
  font-family:Inter,sans-serif;
  font-size:11px;
  margin-right:7px;
}

.overview-table .missing{
  color:#aaa39a;
}

.member-short{
  display:none;
}

.overview-note{
  margin:12px 2px 16px;
  color:var(--muted);
  font-size:13px;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:700px){

  body{
    background-attachment:scroll;
  }

  .wrap{
    padding:
      28px
      12px
      60px;
  }

  h1{
    font-size:34px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .book{
    padding:17px;
  }

  .overview-wrap{
    border-radius:15px;
  }

  .overview-table th{
    padding:11px 5px;
    font-size:12px;
  }

  .overview-table td{
    padding:13px 5px;
    font-size:15px;
  }

  .overview-table th:first-child{
    width:52%;
  }

  .overview-table th:last-child{
    width:13%;
  }

  .overview-table td:first-child{
    font-size:16px;
  }

  .overview-table .average{
    font-size:17px;
  }

  .member-full{
    display:none;
  }

  .member-short{
    display:inline;
  }

}


/* =========================
   VERY SMALL PHONES
   ========================= */

@media(max-width:430px){

  .wrap{
    padding-left:8px;
    padding-right:8px;
  }

  .overview-table th{
    padding-left:3px;
    padding-right:3px;
  }

  .overview-table td{
    padding-left:3px;
    padding-right:3px;
  }

  .overview-table td:first-child{
    font-size:15px;
  }

  .overview-table .rank{
    margin-right:4px;
  }

}

</style>
</head>


<body>

<div class="wrap">

<header>
  <h1>📚 Bokklubben</h1>
  <div class="sub" id="subtitle">Laddar…</div>
</header>


<div class="toolbar" id="tabs"></div>


<div id="content">
  <div class="loading">
    Hämtar böcker och betyg…
  </div>
</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
  "https://iunoonvcydjjhpnqryrp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_gLvrE3BmoYF4X-GadC7Otw_rMN7bnMn";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   APP DATA
   ========================= */

let members = [];
let books = [];
let ratings = [];

let selected =
  localStorage.getItem("bokklubbSelectedMember")
  || "Gustav";

let tab = "rate";


/* =========================
   HELPERS
   ========================= */

function esc(s){

  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


function getRating(bookId, memberId){

  const r =
    ratings.find(
      x =>
        x.book_id === bookId &&
        x.member_id === memberId
    );

  return r ? r.rating : null;

}


function getBookRatings(bookId){

  return members.map(
    m => getRating(bookId,m.id)
  );

}


function avg(vals){

  const v =
    vals.filter(
      x => x != null
    );

  return v.length
    ? v.reduce((a,b)=>a+b,0) / v.length
    : 0;

}


/* =========================
   TABS
   ========================= */

function renderTabs(){

  document.getElementById("tabs").innerHTML =

    `<button
      class="${tab==='rate'?'active':''}"
      onclick="tab='rate';render()">
      ⭐ Sätt betyg
    </button>

     <button
      class="${tab==='overview'?'active':''}"
      onclick="tab='overview';render()">
      📊 Översikt
    </button>

     <button
      class="${tab==='add'?'active':''}"
      onclick="tab='add';render()">
      ➕ Lägg till bok
    </button>`;

}


/* =========================
   MEMBERS
   ========================= */

function renderMembers(){

  const el =
    document.getElementById("members");

  el.innerHTML =

    `<strong
      style="
        width:100%;
        font-size:14px;
        color:var(--muted)">
      Vem är du?
    </strong>` +

    members.map(m =>

      `<button
        class="${m.name===selected?'active':''}"
        onclick="chooseMember('${esc(m.name)}')">
        👤 ${esc(m.name)}
      </button>`

    ).join("");

}


function chooseMember(name){

  selected = name;

  localStorage.setItem(
    "bokklubbSelectedMember",
    selected
  );

  render();

}


/* =========================
   RATE VIEW
   ========================= */

function renderBooks(){

  const member =
    members.find(
      m => m.name === selected
    ) || members[0];

  if(!member) return;


  document.getElementById("books").innerHTML =

    books.map((b,i)=>{

      const vals =
        getBookRatings(b.id);

      const mine =
        getRating(
          b.id,
          member.id
        );

      const a =
        avg(vals);

      const valid =
        vals.filter(
          x => x != null
        );


      return `

        <article class="book">

          <div class="num">
            #${String(i+1).padStart(2,"0")}
          </div>

          <div class="title">
            ${esc(b.title)}
          </div>

          <div class="rating">

            ${[1,2,3,4,5].map(n =>

              `<button
                class="star ${mine>=n?'on':''}"
                aria-label="${n} av 5 stjärnor"
                onclick="rate(${b.id},${n})">
                ★
              </button>`

            ).join("")}

            <div class="avg">
              ${a ? a.toFixed(1) : "—"}
              <span class="votes">
                (${valid.length})
              </span>
            </div>

          </div>


          <div class="mine">
            Ditt betyg:
            <b>
              ${mine ? mine+" / 5" : "inte satt"}
            </b>
          </div>


          <div class="bar">
            <div
              class="fill"
              style="width:${a*20}%">
            </div>
          </div>

        </article>

      `;

    }).join("");

}


/* =========================
   SAVE RATING
   ========================= */

async function rate(bookId,value){

  const member =
    members.find(
      m => m.name === selected
    );

  if(!member) return;


  document
    .querySelectorAll(".star")
    .forEach(
      b => b.disabled = true
    );


  const { error } =
    await db
      .from("ratings")
      .upsert(
        {
          book_id:bookId,
          member_id:member.id,
          rating:value
        },
        {
          onConflict:
            "book_id,member_id"
        }
      );


  document
    .querySelectorAll(".star")
    .forEach(
      b => b.disabled = false
    );


  if(error){

    showError(
      "Kunde inte spara betyget: "
      + error.message
    );

    return;

  }


  await loadData();

  render();

}


/* =========================
   OVERVIEW
   ========================= */

function renderOverview(){

  const rows = books

    .map(b => {

      const vals =
        getBookRatings(b.id);

      return {
        book:b,
        vals:vals,
        avg:avg(vals)
      };

    })

    .sort(
      (a,b) => b.avg-a.avg
    );


  document.getElementById("content").innerHTML = `

    <div class="legend">
      Alla medlemmars betyg.
      Böckerna sorteras efter snittbetyg.
    </div>

    <div class="overview-wrap">

      <table class="overview-table">

        <thead>

          <tr>

            <th>Bok</th>

            ${members.map(m => `

              <th>

                <span class="member-full">
                  ${esc(m.name)}
                </span>

                <span class="member-short">
                  ${esc(m.name.charAt(0))}
                </span>

              </th>

            `).join("")}

            <th>Snitt</th>

          </tr>

        </thead>


        <tbody>

          ${rows.map((r,i) => `

            <tr>

              <td>

                <span class="rank">
                  ${i+1}
                </span>

                ${esc(r.book.title)}

              </td>


              ${r.vals.map(v => `

                <td>

                  ${
                    v != null
                    ? `<span class="score">${v}</span>`
                    : `<span class="missing">–</span>`
                  }

                </td>

              `).join("")}


              <td class="average">

                ${r.avg
                  ? r.avg.toFixed(1)
                  : "–"}

              </td>

            </tr>

          `).join("")}

        </tbody>

      </table>

    </div>

  `;

}


/* =========================
   ADD BOOK
   ========================= */

function renderAddBook(){

  document.getElementById("content").innerHTML = `

    <div class="add-box">

      <h2>➕ Lägg till bok</h2>

      <div class="add-form">

        <input
          id="newTitle"
          type="text"
          placeholder="Boktitel"
          maxlength="200"
        >

        <input
          id="newAuthor"
          type="text"
          placeholder="Författare (valfritt)"
          maxlength="200"
        >

        <button
          onclick="addBook()">
          Lägg till
        </button>

      </div>

      <div
        id="addStatus"
        class="status">
      </div>

    </div>

  `;

}


/* =========================
   INSERT NEW BOOK
   ========================= */

async function addBook(){

  const titleEl =
    document.getElementById("newTitle");

  const authorEl =
    document.getElementById("newAuthor");

  const status =
    document.getElementById("addStatus");


  const title =
    titleEl.value.trim();

  const author =
    authorEl.value.trim();


  if(!title){

    status.textContent =
      "Skriv en boktitel först.";

    titleEl.focus();

    return;

  }


  status.textContent =
    "Lägger till boken…";


  const { error } =
    await db
      .from("books")
      .insert({
        title:title,
        author:author || null
      });


  if(error){

    status.textContent =
      "Kunde inte lägga till boken: "
      + error.message;

    return;

  }


  await loadData();

  tab = "rate";

  render();

}


/* =========================
   ERROR
   ========================= */

function showError(msg){

  document
    .getElementById("content")
    .insertAdjacentHTML(
      "afterbegin",
      `<div class="error">
        ${esc(msg)}
      </div>`
    );

}


/* =========================
   MAIN RENDER
   ========================= */

function render(){

  renderTabs();


  if(tab === "rate"){

    document.getElementById("content").innerHTML = `

      <div
        class="toolbar"
        id="members">
      </div>

      <div class="legend">
        Välj medlem och klicka sedan
        på stjärnorna för att sätta betyg.
      </div>

      <div
        class="grid"
        id="books">
      </div>

    `;

    renderMembers();
    renderBooks();

  }


  else if(tab === "overview"){

    renderOverview();

  }


  else if(tab === "add"){

    renderAddBook();

  }

}


/* =========================
   LOAD DATABASE
   ========================= */

async function loadData(){

  const [
    mRes,
    bRes,
    rRes
  ] = await Promise.all([

    db
      .from("members")
      .select("id,name")
      .order("id"),

    db
      .from("books")
      .select(
        "id,title,author,created_at"
      )
      .order("id"),

    db
      .from("ratings")
      .select(
        "id,book_id,member_id,rating"
      )

  ]);


  if(mRes.error)
    throw mRes.error;

  if(bRes.error)
    throw bRes.error;

  if(rRes.error)
    throw rRes.error;


  members =
    mRes.data || [];

  books =
    bRes.data || [];

  ratings =
    rRes.data || [];


  if(
    !members.some(
      m => m.name === selected
    )
  ){

    selected =
      members[0]?.name
      || "Gustav";

  }


  document
    .getElementById("subtitle")
    .textContent =
      `${books.length} böcker · `
      + `${members.length} medlemmar · `
      + `betyg 1–5`;

}


/* =========================
   START
   ========================= */

(async function init(){

  try{

    await loadData();

    render();

  }

  catch(e){

    document
      .getElementById("content")
      .innerHTML = `

        <div class="error">

          <b>
            Kunde inte ansluta
            till Bokklubbens databas.
          </b>

          <br>

          ${esc(e.message || e)}

        </div>

      `;

  }

})();

</script>

</body>
</html>
