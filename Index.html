<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bokklubben</title>
<style>
  :root{--bg:#f5f1ea;--card:#fffdf9;--ink:#292621;--muted:#7b746b;--line:#e5ddd2;--accent:#8d5d3b;--star:#d29a32}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .wrap{max-width:1050px;margin:auto;padding:42px 20px 70px}
  header{margin-bottom:28px} h1{font-family:Georgia,serif;font-size:42px;margin:0 0 7px} .sub{color:var(--muted)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
  button,.select{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;color:var(--ink);font-size:15px}
  button.active{background:var(--ink);color:white;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}
  .book{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 3px 12px #00000008}
  .num{font-size:12px;color:var(--muted);margin-bottom:7px}.title{font-family:Georgia,serif;font-size:22px;line-height:1.15;margin-bottom:17px}
  .rating{display:flex;align-items:center;gap:4px;margin-bottom:12px}
  .star{font-size:29px;line-height:1;border:0;background:none;padding:0;cursor:pointer;color:#d8d0c5}
  .star.on,.star.hover{color:var(--star)}
  .avg{margin-left:auto;font-weight:700;font-size:14px}.votes{color:var(--muted);font-weight:400}
  .mine{font-size:13px;color:var(--muted);margin-top:5px}.mine b{color:var(--ink)}
  .bar{height:6px;background:#eee8df;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;background:var(--star);border-radius:99px}
  .legend{margin:25px 0 14px;color:var(--muted);font-size:13px}
  @media(max-width:600px){h1{font-size:34px}.wrap{padding-top:28px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📚 Bokklubben</h1>
  <div class="sub">21 böcker · 4 medlemmar · betyg 1–5</div>
</header>

<div class="toolbar" id="tabs"></div>
<div id="content"></div>
</div>

<script>
const members=["Gustav","Axel","Chris","Wille"];
const titles=[
"Kungen av Nostratien","Stäppvargen","Klenoden","Om uträkning av omfång 1",
"Om uträkning av omfång 2","Pappaklausulen","Fäder och söner","Arv och miljö",
"Vem dödade min far?","Spionernas arv","Koryfeerna","Stacken",
"De kommer drunkna i sina mödrars tårar","Anteckningar från källarhålet",
"Becoming Earnest","Lolita","Air","1979","De polyglotta älskarna","Detaljerna","Kött"
];

// Dummydata så prototypen ser levande ut. Byt/ta bort när riktiga betyg finns.
const demo={
"Kungen av Nostratien":[5,4,4,5],"Stäppvargen":[4,5,3,4],"Klenoden":[4,4,5,4],
"Om uträkning av omfång 1":[3,4,4,3],"Om uträkning av omfång 2":[4,3,4,5],
"Pappaklausulen":[5,4,5,4],"Fäder och söner":[4,5,4,4],"Arv och miljö":[5,5,4,5],
"Vem dödade min far?":[4,4,3,4],"Spionernas arv":[3,4,4,3],"Koryfeerna":[4,3,4,4],
"Stacken":[5,4,5,4],"De kommer drunkna i sina mödrars tårar":[5,5,4,5],
"Anteckningar från källarhålet":[4,5,4,5],"Becoming Earnest":[3,4,3,4],
"Lolita":[5,4,5,4],"Air":[4,3,4,4],"1979":[4,5,4,3],
"De polyglotta älskarna":[5,4,5,5],"Detaljerna":[4,5,4,5],"Kött":[5,4,5,4]
};

let selected="Gustav";
let tab="rate";
const ratings=JSON.parse(localStorage.getItem("bokklubbRatings")||"null") || structuredClone(demo);

function save(){localStorage.setItem("bokklubbRatings",JSON.stringify(ratings))}
function renderTabs(){
  document.getElementById("tabs").innerHTML=
    `<button class="${tab==='rate'?'active':''}" onclick="tab='rate';render()">⭐ Sätt betyg</button>
     <button class="${tab==='overview'?'active':''}" onclick="tab='overview';render()">📊 Översikt</button>`;
}
function renderMembers(){
  const el=document.getElementById("members");
  el.innerHTML=`<strong style="width:100%;font-size:14px;color:var(--muted)">Vem är du?</strong>` +
    members.map(m=>`<button class="${m===selected?'active':''}" onclick="selected='${m}';renderMembers();renderBooks()">👤 ${m}</button>`).join("");
}
function renderBooks(){
 const idx=members.indexOf(selected);
 document.getElementById("books").innerHTML=titles.map((t,i)=>{
   const vals=ratings[t]||[null,null,null,null], mine=vals[idx];
   const valid=vals.filter(x=>x!=null), avg=valid.length?(valid.reduce((a,b)=>a+b,0)/valid.length):0;
   return `<article class="book">
    <div class="num">#${String(i+1).padStart(2,"0")}</div>
    <div class="title">${t}</div>
    <div class="rating">${[1,2,3,4,5].map(n=>`<button class="star ${mine>=n?'on':''}" onclick="rate(${i},${n})">★</button>`).join("")}
      <div class="avg">${avg?avg.toFixed(1):"—"} <span class="votes">(${valid.length})</span></div>
    </div>
    <div class="mine">Ditt betyg: <b>${mine?mine+" / 5":"inte satt"}</b></div>
    <div class="bar"><div class="fill" style="width:${avg*20}%"></div></div>
   </article>`;
 }).join("");
}
function rate(bookIndex,value){
 const t=titles[bookIndex], idx=members.indexOf(selected);
 if(!ratings[t]) ratings[t]=[null,null,null,null];
 ratings[t][idx]=value; save(); renderBooks();
}
function renderOverview(){
 const rows=titles.map(t=>{
   const vals=ratings[t]||[null,null,null,null], valid=vals.filter(x=>x!=null);
   const avg=valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:0;
   return {t,vals,avg};
 }).sort((a,b)=>b.avg-a.avg);
 document.getElementById("content").innerHTML=`<div class="legend">Alla medlemmars betyg på samma ställe. Böckerna sorteras efter snittbetyg.</div>
 <div class="grid">${rows.map((r,i)=>`<article class="book">
   <div class="num">#${i+1}</div><div class="title">${r.t}</div>
   <div style="font-size:32px;font-weight:800;margin:2px 0 4px">${r.avg?r.avg.toFixed(1):"—"}</div>
   <div class="rating" style="margin-bottom:14px"><span style="font-size:22px;color:var(--star)">${r.avg?"★".repeat(Math.round(r.avg)):"☆☆☆☆☆"}</span>
   <span class="votes">${r.vals.filter(x=>x!=null).length} röster</span></div>
   ${members.map((m,j)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px"><span>${m}</span><span style="color:var(--star)">${r.vals[j]?("★".repeat(r.vals[j])+"☆".repeat(5-r.vals[j])):"—"}</span></div>`).join("")}
 </article>`).join("")}</div>`;
}
function render(){
 renderTabs();
 if(tab==="rate"){
   document.getElementById("content").innerHTML=`<div class="toolbar" id="members"><strong style="width:100%;font-size:14px;color:var(--muted)">Vem är du?</strong></div><div class="legend">Välj medlem och klicka sedan på stjärnorna för att sätta betyg.</div><div class="grid" id="books"></div>`;
   renderMembers(); renderBooks();
 } else renderOverview();
}
render();
</script>
</body>
</html>
